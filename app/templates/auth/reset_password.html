<!doctype html>
<html lang="en" class="bg-[#081018]"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password / Signal</title><script src="https://cdn.tailwindcss.com"></script><style>@media (max-width:639px){body{padding-top:2rem;padding-bottom:2rem}body>main>div{padding:1.25rem}}</style></head>
<body class="grid min-h-screen place-items-center bg-[#081018] px-5 text-slate-100 antialiased"><main class="w-full max-w-md"><a href="{{ url_for('landing.landing') }}" class="mb-10 flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-[#c8ff5a] font-black text-[#081018]">S</span><span class="text-sm font-bold uppercase tracking-[.24em]">Signal<span class="text-[#c8ff5a]">.</span></span></a><div class="rounded-3xl border border-white/[.1] bg-[#101923] p-7 shadow-2xl shadow-black/25 sm:p-9"><p class="text-xs font-semibold uppercase tracking-[.2em] text-[#c8ff5a]">Account recovery</p><h1 class="mt-3 text-3xl font-semibold tracking-[-.04em] text-white">Choose a new password.</h1>{% if invalid_token %}<p class="mt-5 rounded-xl border border-rose-400/20 bg-rose-400/[.06] px-4 py-3 text-sm leading-6 text-rose-300">{{ error }}</p>{% else %}<form method="post" class="mt-8 space-y-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label class="text-xs uppercase tracking-wider text-slate-500" for="password">New password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" class="mt-2 w-full rounded-xl border border-white/[.1] bg-[#081018] px-4 py-3 text-white outline-none focus:border-[#c8ff5a]/60"><p class="mt-2 text-xs text-slate-600">Use at least 8 characters.</p></div>{% if error %}<p class="rounded-xl border border-rose-400/20 bg-rose-400/[.06] px-4 py-3 text-sm text-rose-300">{{ error }}</p>{% endif %}<button class="w-full rounded-xl bg-[#c8ff5a] px-5 py-3.5 font-bold text-[#081018] hover:bg-[#d9ff89]">Save new password</button></form>{% endif %}<p class="mt-7 text-center text-sm text-slate-500"><a href="{{ url_for('auth.login') }}" class="font-semibold text-[#c8ff5a]">Back to login</a></p></div></main></body></html>
